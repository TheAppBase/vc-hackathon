<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Touch</title><style>
:root{--text:#1d1d1f;--muted:rgba(29,29,31,.6);--glass:rgba(255,255,255,.42);--glass-strong:rgba(255,255,255,.64);--edge:rgba(255,255,255,.72);

@media (prefers-color-scheme:dark){:root{--text:#f5f5f7;--muted:rgba(245,245,247,.62);--glass:rgba(28,34,38,.5);--glass-strong:rgba(38,44,48,.74);

*{box-sizing:border-box}html{background:#2f4a47}

-webkit-font-smoothing:antialiased;background:var(--sky)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 80% 70%,rgba(64,110,96,.55),transparent 70%),
radial-gradient(50% 30% at 15% 75%,rgba(214,120,72,.26),transparent 70%),radial-gradient(70% 45% at 50% 0%,rgba(255,255,255,.35),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer}.ic{flex:none;vertical-align:-3px}
.glass{background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.55);
-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.app{height:100%;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:72px max(20px,calc(50% - 440px)) 12px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;padding:3px 0;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 10px rgba(16,44,52,.08)}
.bubble b.who{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:1px}
.msg.me{justify-content:flex-end}.msg.me .bubble{background:var(--grad);color:#fff;border-color:transparent;border-radius:20px 20px 6px 20px}
.msg.sys{justify-content:center}.msg.sys span{font-size:12.5px;color:var(--muted);padding:4px 12px;border-radius:999px;background:var(--glass)}
.typing .bubble{display:flex;gap:4px;padding:13px 14px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

.toolcard code{display:block;margin:3px 0 1px;font:12.5px ui-monospace,"SF Mono",Menlo,monospace;word-break:break-word}.toolcard .tr{color:var(--muted)}
.card{background:var(--glass-strong);border:1px solid var(--edge);border-radius:18px;padding:14px 16px;box-shadow:0 4px 18px rgba(16,44,52,.1);animation:in .3s ease-out}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-width:860px}
.lead .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.lead h4{margin:0;font-size:16px}.lead small{color:var(--muted);display:block}
.ring{--p:0;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
background:radial-gradient(closest-side,var(--solid) 78%,transparent 80%),conic-gradient(var(--blue) calc(var(--p)*1%),rgba(127,127,127,.2) 0)}
.lead p{margin:8px 0;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.pill.s-due,.pill.v-take{color:#c93400;background:rgba(255,149,0,.15);border-color:transparent}
.pill.s-overdue{color:var(--red);background:rgba(255,59,48,.13);border-color:transparent}.pill.s-scheduled,.pill.v-warm{color:var(--blue);background:rgba(10,132,255,.12);border-color:transparent}
.pill.s-warm{color:var(--gray);background:rgba(142,142,147,.15);border-color:transparent}
@media (prefers-color-scheme:dark){.pill.s-due,.pill.v-take{color:#ffb340}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;background:var(--glass);border:1px solid var(--edge);
box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}.btn.primary{background:var(--grad);color:#fff;border-color:transparent}.btn:hover{filter:brightness(1.05)}
.profile{max-width:560px}.profile .head{display:flex;gap:12px;align-items:center;margin-bottom:8px}.profile .head b{font-size:17px;display:block}

.bars{display:grid;gap:5px;margin-top:10px}.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar span.t{height:6px;border-radius:999px;background:rgba(127,127,127,.18);overflow:hidden}.bar span.t i{display:block;height:100%;background:var(--grad);border-radius:999px}
.rows{max-width:760px;padding:6px 16px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.src{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);color:var(--blue);flex:none}
.row b{font-weight:600}.row small{display:block;color:var(--muted);font-size:12.5px}.row .right{text-align:right;font-size:12px;color:var(--muted)}
.draft{white-space:pre-wrap;font-size:14px;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin:6px 0}
.bottom{padding:0 max(14px,calc(50% - 450px)) 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;justify-content:center}

-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:inline-flex;align-items:center;gap:6px}
.composer{display:flex;gap:8px;align-items:center;padding:6px;border-radius:999px}
.round{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.round.send{background:var(--grad);color:#fff}.round.mic{background:var(--glass);border:1px solid var(--edge)}
.corner{position:fixed;top:16px;right:18px;z-index:30;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}

overflow-y:auto;color:var(--text)}
.sheet[open]{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(10,20,22,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:20px}
.sheet h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}.list li small{display:block;color:var(--muted);font-size:12px}.list li .end{margin-left:auto}
.add{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.add input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--text);padding:6px 10px;outline:none}
.hint{color:var(--muted);font-size:12px;margin:8px 2px 0}.hint.err{color:var(--red)}.rm{background:none;border:0;color:var(--muted);font-size:12.5px}
.small{color:var(--muted);font-size:12.5px}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
@media (max-width:620px){.chat{padding:64px 12px 10px}.indent{margin-left:0}.bubble{max-width:88%}.corner{top:10px;right:10px}
.kv{grid-template-columns:90px 1fr}.bar{grid-template-columns:100px 1fr 30px}.chips{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{flex:none}.bottom{padding:0 10px 10px}.row{grid-template-columns:auto 1fr}.row .right{grid-column:2;text-align:left}}

[hidden]{display:none!important}
.btn,.chip,.round,.tab,.corner,.rm{transition:transform .12s ease,filter .12s ease,opacity .12s ease}
.btn:active,.chip:active,.round:active,.tab:active,.corner:active,.rm:active{transform:scale(.95)}
.btn.busy{transform:scale(.97);filter:saturate(.7) brightness(.95);cursor:progress}
.btn:disabled:not(.busy){opacity:.55;cursor:default}
@media (prefers-reduced-motion:reduce){.btn,.chip,.round,.tab,.corner,.rm{transition:none}.btn:active,.chip:active,.round:active,.tab:active,.corner:active,.rm:active,.btn.busy{transform:none}}
.composer{border-radius:26px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--text);padding:8px 12px;outline:none;resize:none;
max-height:168px;line-height:1.45}
.composer.listening{box-shadow:var(--shadow),0 0 0 2px rgba(255,59,48,.55)}
.round.mic.on{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}50%{box-shadow:0 0 0 8px rgba(255,59,48,0)}}
.listen-hint{font-size:12px;color:var(--red);text-align:center;margin:-2px 0 6px;min-height:0}
.auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px}
.auth .card{width:min(400px,100%);padding:26px}.auth h1{margin:0 0 4px;font-size:24px}.auth p{margin:0 0 16px;color:var(--muted);font-size:14px}
.field{display:block;margin:0 0 12px}.field span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
.field input{width:100%;border:1px solid var(--edge);background:var(--glass);border-radius:12px;padding:10px 12px;font:inherit;color:var(--text);outline:none}
.field input:focus{border-color:var(--blue)}
.hint.ok{color:var(--green)}.hint:empty{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);margin:0 0 14px}
.tab{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab.on{background:var(--glass-strong);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pw{display:grid;gap:6px;margin-top:6px}.pw input{width:100%;border:1px solid var(--edge);background:var(--glass);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px;color:var(--text);outline:none}.wide{width:100%;justify-content:center;padding:10px 14px;font-size:14px}
.action{max-width:600px;border-radius:16px;padding:12px 14px;background:var(--glass-strong);border:1px solid var(--edge);animation:in .25s ease-out}
.action .th{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}.action .th .ic{color:var(--orange)}
.action .th b{color:var(--text);font-size:13px}.action .st{margin-left:auto;font-weight:600}
.action.done .th .ic,.action.done .st{color:var(--green)}
.action.blocked,.action.failed{border-color:rgba(255,59,48,.5)}.action.blocked .st,.action.failed .st,.action.blocked .th .ic{color:var(--red)}
.action .body{font-size:13.5px;margin:8px 0 2px;white-space:pre-wrap;max-height:220px;overflow:auto}
.action .why{margin-top:4px}
.orig{font-size:12.5px;color:var(--muted);margin:4px 0 0}.orig summary{cursor:pointer}
.xt{display:grid;grid-template-columns:88px 1fr;gap:2px 10px;font-size:13px;margin:8px 0 0}.xt dt{color:var(--muted)}.xt dd{margin:0}
.seg{display:grid;gap:8px}.seg label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);
background:var(--glass);cursor:pointer}.seg label.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.seg label.off{opacity:.55;cursor:not-allowed}.seg input{margin-top:4px}.seg small{display:block;color:var(--muted);font-size:12px}
.log li{font-size:12.5px}.log .pill{margin-left:auto;flex:none}
</style></head><body>
<div class="app" id="app" hidden><div class="chat" id="chat" aria-live="polite"></div>
<div class="bottom"><div class="chips" id="chips"></div><div class="listen-hint" id="listen-hint"></div>
<form class="composer glass" id="composer"><button type="button" class="round mic" id="mic" aria-label="Record a note" title="Record a note"></button>
<textarea id="input" rows="1" autocomplete="off" placeholder="Record or type a note, or ask your agent" aria-label="Message"></textarea><button class="round send" aria-label="Send" id="send"></button></form></div></div>
<button class="corner glass" id="open-settings" aria-label="Settings" hidden></button>
<dialog class="glass sheet" id="settings"></dialog>
<div class="auth" id="auth" hidden><form class="card glass" id="auth-form" autocomplete="on">
<h1>Last Touch</h1><p>Your personal sourcing agent. Record a quick note after every event; it keeps track of who you met and what's next, and shares it with your team.</p>
<div class="tabs" role="tablist"><button type="button" role="tab" class="tab on" id="tab-in" aria-selected="true">Sign in</button><button type="button" role="tab" class="tab" id="tab-up" aria-selected="false">Create account</button></div>
<label class="field" id="f-name" hidden><span>Your name</span><input id="auth-name" placeholder="Your name" maxlength="60" autocomplete="name"></label>
<label class="field"><span>Username</span><input id="auth-user" placeholder="your-username" maxlength="31" required autocapitalize="off" spellcheck="false" autocomplete="username"></label>
<label class="field"><span>Password</span><input id="auth-pass" type="password" placeholder="Password" maxlength="200" required autocomplete="current-password"></label>
<p class="hint" id="auth-hint"></p>
<button class="btn primary wide" id="auth-go">Sign in</button></form></div>
<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const ic = (n, s) => `<svg class="ic" width="${s || 16}" height="${s || 16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${D.icons[n] || ''}</svg>`;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const chat = $('#chat'), chipsEl = $('#chips'), input = $('#input');
  let ME = null;
  $('#mic').innerHTML = ic('mic', 18); $('#send').innerHTML = ic('up', 18); $('#open-settings').innerHTML = ic('settings', 18);

  // ---------------------------------------------------------------- server
  class NeedsSignin extends Error {}
  // One id per conversation (this tab, and a new one after 30 minutes idle), so PRISM groups its traces together.
  const newChatId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 36);
  let CHAT_ID = newChatId(), lastCall = Date.now();
  async function api(url, body, method) {
    if (Date.now() - lastCall > 30 * 60 * 1000) CHAT_ID = newChatId();
    lastCall = Date.now();
    const d = new Date(), pad = (n) => String(n).padStart(2, '0');
    const opts = {method: method || (body === undefined ? 'GET' : 'POST'), headers: {
      'X-Local-Date': `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, 'X-TZ-Offset': String(d.getTimezoneOffset()), 'X-Chat-Id': CHAT_ID}};
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    let j = {}; try { j = await r.json(); } catch (e) { j = {}; }
    if (r.status === 401) { showAuth(j.reason || (ME ? 'expired' : null)); throw new NeedsSignin(); }
    if (!r.ok) { const e = new Error(j.message || j.error || ('HTTP ' + r.status)); e.said = !!(j.message || j.error); e.code = j.error; e.status = r.status; e.retryAfter = j.retry_after; throw e; }
    return j;
  }

  // ---------------------------------------------------------------- chat primitives
  const initials = (n) => String(n).replace(/^@/, '').split(/[\s._-]+/).map((p) => p[0] || '').join('').slice(0, 2).toUpperCase();
  const hue = (s) => `hsl(${[...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7)} 60% 50%)`;
  const me = () => (ME ? `${ME.first}'s agent` : 'Your agent');
  const scroll = () => { chat.scrollTop = chat.scrollHeight; };
  function add(html) { chat.insertAdjacentHTML('beforeend', html); scroll(); return chat.lastElementChild; }
  function agentAvatar(who) {
    if (!who) return `<span class="avatar me-agent">${ic('spark', 16)}</span>`;
    return `<span class="avatar" style="--hue:${hue(who.id)}">${esc(initials(who.name))}</span>`;
  }
  function say(html, who) {
    const name = who ? `${who.name}'s agent` : me();
    return add(`<div class="msg">${agentAvatar(who)}<div class="bubble"><b class="who">${esc(name)}</b><div>${html}</div></div></div>`);
  }
  const mine = (text) => add(`<div class="msg me"><div class="bubble" style="white-space:pre-wrap">${esc(text)}</div></div>`);
  const sys = (text) => add(`<div class="msg sys"><span>${esc(text)}</span></div>`);
  const block = (html) => add(`<div class="indent">${html}</div>`);
  async function typing(ms) {
    const el = add(`<div class="msg typing">${agentAvatar()}<div class="bubble"><i></i><i></i><i></i></div></div>`);
    await sleep(ms || 400); el.remove();
  }
  async function tool(call, fn, opts) {
    opts = opts || {};
    const icon = opts.kind === 'mem' ? 'db' : opts.kind === 'agent' ? 'agent' : opts.kind || 'tool';
    const head = esc(me()) + (opts.target ? ` &rarr; ${esc(opts.target)}` : '');
    const el = block(`<div class="toolcard running"><div class="th">${ic(icon, 14)}<span class="tk">${opts.write ? 'Write' : 'Read'}</span><span>${head}</span><span class="st">running</span></div><code>${esc(call)}</code><div class="tr"></div></div>`);
    const card = el.querySelector('.toolcard'), st = card.querySelector('.st');
    try {
      const res = await fn();
      card.classList.remove('running'); st.textContent = 'done'; st.classList.add('ok');
      card.querySelector('.tr').textContent = opts.result ? opts.result(res) : ''; scroll();
      return res;
    } catch (e) {
      card.classList.remove('running'); st.textContent = 'failed'; st.style.color = 'var(--red)';
      card.querySelector('.tr').textContent = e instanceof NeedsSignin ? 'signed out' : e.message; scroll();
      throw e;
    }
  }
  function setChips(list) {
    chipsEl.innerHTML = list.map((c, i) => `<button type="button" class="chip ${c.cls || ''}" data-i="${i}">${c.icon ? ic(c.icon, 14) : ''}${esc(c.label)}</button>`).join('');
    chipsEl.onclick = (ev) => { const b = ev.target.closest('.chip'); if (b && (!busy || b.dataset.free)) list[+b.dataset.i].act(b); };
  }
  let busy = false;
  async function run(fn) {
    if (busy) return; busy = true;
    try { await fn(); } catch (e) {
      if (e instanceof NeedsSignin) { if (current) queued.unshift(current); return; }  // its own request was refused: it goes back in the box (finally)
      say(esc(e.message || 'Something went wrong. Try again.'));
    } finally {
      busy = false; current = null;

  async function team() {
    if (!ME.team.length) { say('You have no teammates yet. Open Settings and add people by their username.'); return; }
    const r = await tool('list_relationships()', () => api('/api/team/activity'), {kind: 'agent', target: 'team agents',
      result: (r) => `${r.team.length} agent${r.team.length === 1 ? '' : 's'} replied`});
    for (const m of r.team) {
      if (!m.count) { say(`No founders in my notes yet.${m.latest ? ` Latest note: "${esc(m.latest)}"` : ''}`, {id: m.username, name: m.name.split(' ')[0]}); continue; }
      const lines = m.founders.map((f) => `${esc(f.who)}${f.event ? ` (met at ${esc(f.event)})` : ''}, ${esc(f.when)}: ${esc(f.next_step || 'no next step')}${f.status === 'overdue' ? ' · overdue' : ''}`);
      say(`Talking to ${m.count} founder${m.count === 1 ? '' : 's'}${m.focus ? `. Focus: ${esc(m.focus)}` : ''}.<br>${lines.join('<br>')}`, {id: m.username, name: m.name.split(' ')[0]});
    }
    if (r.pending.length) sys(`Waiting for ${r.pending.map((u) => '@' + u).join(', ')} to add you back before their agents share with you.`);
  }

  // ---------------------------------------------------------------- settings
  async function renderSettings() {
    const dlg = $('#settings'), p = ME.profile;
    // Drawn once; the parts that load later (team, connections, log) are filled in place, so nothing you've typed is lost.
    const draw = () => {
      dlg.innerHTML = `<div class="sheet-head"><h2>Settings</h2><button class="round mic" id="close-settings" aria-label="Close">${ic('x', 16)}</button></div>
      <h3>Account</h3><ul class="list"><li>${agentAvatar({id: ME.username, name: ME.name})}<span><b>${esc(ME.name)}</b><small>@${esc(ME.username)}</small></span><button class="rm end" id="signout">Sign out</button></li></ul>
      <form class="pw" id="pw-form" autocomplete="on"><input type="text" name="username" value="${esc(ME.username)}" autocomplete="username" hidden>
        <input type="password" id="pw-cur" placeholder="Current password" autocomplete="current-password" aria-label="Current password">
        <input type="password" id="pw-new" placeholder="New password (8+ characters)" autocomplete="new-password" aria-label="New password">
        <button class="btn">Change password</button></form><p class="hint" id="pw-hint"></p>
      <h3>Your agent</h3>${p ? `<ul class="list"><li>${agentAvatar()}<span><b>${esc(ME.first)}'s agent</b><small>${esc([...p.sectors, ...(p.extra_focus || [])].join(', '))} · ${esc(p.stages.join(', '))}</small></span></li></ul>` : '<p class="small">Finish the interview in the chat to build your agent.</p>'}
      <h3>Safety</h3><div class="seg">
        <label class="${ME.mode === 'ask' ? 'on' : ''}"><input type="radio" name="mode" value="ask" ${ME.mode === 'ask' ? 'checked' : ''}><span><b>Ask mode (PRISM off)</b><small>Nothing is sent to PRISM. Your notes save straight away.</small></span></label>
        <label class="${ME.mode === 'auto' ? 'on' : ''} ${D.prism ? '' : 'off'}"><input type="radio" name="mode" value="auto" ${ME.mode === 'auto' ? 'checked' : ''} ${D.prism ? '' : 'disabled'}><span><b>Auto mode (PRISM on)</b><small>${D.prism ? 'PRISM watches everything the agent does and reviews each note before it is saved. It can block an unsafe note; you never have to approve one.' : D.prism_error ? `PRISM couldn't start: ${esc(D.prism_error)}` : 'Needs PRISMTRACE_API_KEY on the server.'}</small></span></label>
      </div><p class="hint err" id="mode-hint"></p><p class="hint">Reading is always allowed. In both modes, secrets (keys, passwords, card numbers) are removed from notes before they reach the firm memory.</p>
      <h3>Connected</h3><ul class="list" id="integ-list"><li class="small">Checking…</li></ul>
      <h3>Team</h3><ul class="list" id="team-list"><li class="small">Loading…</li></ul>
      <h3>Add a person</h3><form class="add" id="add-person"><input id="username" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Their username" aria-label="Username"><button class="btn primary" id="add-btn">${ic('userplus', 14)}Add</button></form>
      <p class="hint" id="add-hint">Type their username. Their agent shares with yours once they add you back.</p>
      <h3>Recent agent actions</h3><ul class="list log" id="log-list"><li class="small">Loading…</li></ul>
      `;
      wire();
    };
    const fill = (id, html) => { const el = $('#' + id); if (el) el.innerHTML = html; };
    const removeMate = async (u) => {
      try { ME = (await api('/api/team/' + encodeURIComponent(u), undefined, 'DELETE')).user; sys(`@${u} was removed from your team`); const h = $('#add-hint'); if (h) { h.textContent = `Removed @${u}.`; h.className = 'hint ok'; } loadTeam(); }
      catch (e) {
        if (e instanceof NeedsSignin) return;
        const h = $('#add-hint'); if (h) { h.textContent = `Couldn't remove @${u}: ${e.said ? e.message : 'check your connection'}`; h.className = 'hint err'; }
      }
    };
    const wire = () => {
      $('#close-settings').onclick = () => dlg.close();
      $('#signout').onclick = async () => { try { await api('/api/signout', {}); } catch (e) { /* signed out either way */ } location.href = '/'; };
      $('#pw-form').onsubmit = async (ev) => {
        ev.preventDefault();
        const h = $('#pw-hint'), btn = $('#pw-form button');
        btn.disabled = true; btn.classList.add('busy');
        const stop = countdown(btn, 'Checking password…', 10);
        const done = () => { stop(); btn.disabled = false; btn.classList.remove('busy'); btn.textContent = 'Change password'; };
        try {
          await api('/api/password', {current: $('#pw-cur').value, new: $('#pw-new').value});
          done(); $('#pw-cur').value = $('#pw-new').value = ''; h.textContent = 'Password changed. Other devices are signed out.'; h.className = 'hint ok';
        } catch (e) {
          done();
          if (e instanceof NeedsSignin) return;
          h.textContent = e.message; h.className = 'hint err';
          if (e.status === 429 && e.retryAfter) waitThen(btn, 'Change password', e.retryAfter);
        }
      };
      dlg.querySelectorAll('input[name=mode]').forEach((r) => { r.onchange = async () => {
        try { ME = (await api('/api/settings', {mode: r.value})).user; $('#mode-hint').textContent = ''; sys(ME.mode === 'auto' ? 'Auto mode: PRISM watches the agent and reviews every note.' : 'Ask mode: PRISM is off.'); }
        catch (e) { if (!(e instanceof NeedsSignin)) $('#mode-hint').textContent = e.said ? e.message : "Couldn't change the mode right now. Check your connection."; }
        dlg.querySelectorAll('input[name=mode]').forEach((x) => { x.checked = x.value === ME.mode; x.closest('label').classList.toggle('on', x.value === ME.mode); });
      }; });
      dlg.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => removeMate(b.dataset.rm); });
      const uIn = $('#username'), hint = $('#add-hint');
      let t = null;
      uIn.oninput = () => {
        clearTimeout(t);
        const u = uIn.value.trim().replace(/^@/, '').toLowerCase();
        if (!u) { hint.textContent = 'Type their username.'; hint.className = 'hint'; return; }
        if (!USERNAME_RE.test(u)) { hint.textContent = 'Usernames are 2 to 30 letters, numbers, dots, dashes or underscores.'; hint.className = 'hint err'; return; }
        t = setTimeout(async () => {
          let r;
          try { r = await api('/api/username/' + encodeURIComponent(u)); }
          catch (e) { if (!(e instanceof NeedsSignin) && uIn.value.trim().replace(/^@/, '').toLowerCase() === u) { hint.textContent = e.said ? e.message : "Couldn't check that username right now."; hint.className = 'hint err'; } return; }
          if (uIn.value.trim().replace(/^@/, '').toLowerCase() !== u) return;
          if (!r.valid) { hint.textContent = r.message; hint.className = 'hint err'; }
          else if (r.exists) { hint.textContent = u === ME.username ? "That's you." : `@${u} exists.`; hint.className = u === ME.username ? 'hint err' : 'hint ok'; }
          else { hint.textContent = `No one is called @${u}.`; hint.className = 'hint err'; }
        }, 250);
      };
      $('#add-person').onsubmit = async (ev) => {
        ev.preventDefault();
        const u = uIn.value.trim().replace(/^@/, '').toLowerCase();
        try {
          const r = await api('/api/team', {username: u});
          ME = r.user; uIn.value = '';
          hint.textContent = r.mate.mutual ? `@${u} is on your team and shares with you.` : `Added @${u}. Their agent shares with yours once they add you back.`; hint.className = 'hint ok';
          sys(`@${u} added to your team`); loadTeam();
        } catch (e) { if (!(e instanceof NeedsSignin)) { hint.textContent = e.message; hint.className = 'hint err'; } }
      };
    };
    const loadTeam = async () => {
      let r;
      try { r = await api('/api/team'); } catch (e) { if (!(e instanceof NeedsSignin)) fill('team-list', `<li class="small">Couldn't load your team: ${esc(e.message)}</li>`); return; }
      fill('team-list', r.team.length ? r.team.map((m) => `<li>${agentAvatar({id: m.username, name: m.name})}<span><b>${esc(m.name)}</b><small>@${esc(m.username)} · ${m.mutual ? (m.ready ? 'agent ready, sharing with you' : 'interview pending') : `waiting for @${esc(m.username)} to add you back`}</small></span><button class="rm end" data-rm="${esc(m.username)}">Remove</button></li>`).join('')
        : '<li class="small">No teammates yet.</li>');
      dlg.querySelectorAll('#team-list [data-rm]').forEach((b) => { b.onclick = () => removeMate(b.dataset.rm); });
    };
    draw();
    loadTeam();
    api('/api/actions').then((acts) => {
      fill('log-list', acts.actions.map((a) => `<li><span>${esc(((a.payload || {}).text || a.summary).slice(0, 80))}<small>${esc((a.created_at || '').slice(0, 16).replace('T', ' '))} · ${a.mode === 'auto' ? 'auto (PRISM)' : 'ask'}${a.reason ? ' · ' + esc(a.reason) : ''}</small></span><span class="pill s-${a.status === 'done' ? 'scheduled' : 'overdue'}">${esc(ST[a.status] || a.status)}</span></li>`).join('') || '<li class="small">None yet.</li>');
    }).catch((e) => { if (!(e instanceof NeedsSignin)) fill('log-list', `<li class="small">Couldn't load: ${esc(e.message)}</li>`); });
    api('/api/integrations').then((it) => {
      const pr = it.prism || {};
      const row = (name, ok, text) => `<li><span class="src" style="color:${ok ? 'var(--green)' : 'var(--gray)'}">${ic(ok ? 'check' : 'x', 14)}</span><span>${esc(name)}<small>${esc(text)}</small></span></li>`;
      fill('integ-list', [
        row('Firm memory', /Blob/.test(it.store), it.store),
        row('akta.pro', it.akta.live, it.akta.live ? `Connected${it.akta.paid ? ', Pro lists on' : ', free search only'}${it.akta.error ? ` · last error: ${it.akta.error}` : ''}` : 'Not connected (AKTA_API_KEY)'),
        row('PRISM', pr.credential === 'ok', pr.credential === 'unused' ? pr.detail : !pr.configured && pr.credential !== 'fail' ? 'Not connected (PRISMTRACE_API_KEY)' : pr.credential === 'ok' ? `Credential OK${pr.live ? ', live traces arriving' : `, waiting for live traces${pr.blocked_step ? ` (${pr.blocked_step})` : ''}`}` : `Credential ${pr.credential}${pr.detail ? `: ${pr.detail}` : ''}`),
        row('AI (Nicrron)', it.nicrron.live && !it.nicrron.error, it.nicrron.live ? `Understands your requests (${it.nicrron.fast_model}) and writes up your notes (${it.nicrron.model})${it.nicrron.error ? ` · last error: ${it.nicrron.error}` : ''}` : 'Off: requests are matched by phrases and notes are only tidied, not rewritten (set NICRRON_API_KEY)'),
        row('Roundtable', it.roundtable.live, it.roundtable.live ? `Notes are copied to Roundtable${it.roundtable.error ? ` · last error: ${it.roundtable.error}` : ''}` : 'Not connected (ROUNDTABLE_MCP_URL and ROUNDTABLE_MCP_TOKEN)'),
      ].join(''));
    }).catch((e) => { if (!(e instanceof NeedsSignin)) fill('integ-list', `<li class="small">Couldn't check: ${esc(e.message)}</li>`); });
  }
  $('#open-settings').onclick = () => { $('#settings').showModal(); renderSettings(); };

  // ---------------------------------------------------------------- composer
  let queued = [], current = null, owner = null;  // owner: whose messages are waiting
  // Signed out with messages still waiting: put them back in the box, so nothing typed or dictated is lost.
  const requeue = () => {
    if (queued.length && !input.value.trim()) { input.value = queued.shift().text; grow(); }
  };
  function send(text, via) { current = {text, via}; if (step >= 0) run(() => answer(text)); else run(() => ask(text, via)); }
  $('#composer').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const wasDictated = dictated;
    stopDictation(); dictated = false;
    const text = input.value.trim(); if (!text) return;
    input.value = ''; grow();
    if (busy) {
      // Still working on the last message: send this one (and any others) in order as soon as that's done.
      queued.push({text, via: wasDictated ? 'dictation' : 'typed'});
      sys(queued.length === 1 ? "I'll send this as soon as I finish the last one." : `I'll send this next (${queued.length} waiting).`);
      return;
    }
    send(text, wasDictated ? 'dictation' : 'typed');
  });

  // ---------------------------------------------------------------- sign in / create account
  const SIGNOUT = {account_missing: "You were signed out: your account couldn't be read from storage. Sign in again.",
    password_changed: 'Your password was changed on another device. Sign in with the new one.',
    expired: 'Your session ended. Sign in again.'};
  function showAuth(reason) {
    stopDictation(); if (!busy) requeue();  // while a message is in flight, run() decides when it ends (it may still save)
    $('#app').hidden = true; $('#open-settings').hidden = true; $('#settings').open && $('#settings').close(); $('#auth').hidden = false;
    if (reason) modeUI('in');  // signed out mid-session: back to the Sign in tab
    cancelWait(); authGo.disabled = false; authGo.classList.remove('busy'); authGo.textContent = authMode === 'up' ? 'Create account' : 'Sign in';
    hint(reason && SIGNOUT[reason] ? SIGNOUT[reason] : '', reason && SIGNOUT[reason] ? 'err' : '');
    (authMode === 'up' ? $('#auth-name') : $('#auth-user')).focus();
  }
  let authMode = 'in', check = null, authState = null, waitTimers = [];
  const USERNAME_RE = /^(?!.*\.\.)[a-z0-9][a-z0-9_.-]{1,29}$/;  // same rule as the server
  const cancelWait = () => { waitTimers.forEach((t) => (t.stop ? t.stop() : clearTimeout(t))); waitTimers = []; };
  const authUser = $('#auth-user'), authHint = $('#auth-hint'), authGo = $('#auth-go'), authPass = $('#auth-pass');
  const hint = (text, cls) => { authHint.textContent = text || ''; authHint.className = 'hint' + (cls ? ' ' + cls : ''); };
  // Password checks take about 10 seconds on purpose (one try per 10 seconds), so count down on the button.
  function countdown(btn, text, secs) {
    let n = secs;
    const tick = () => { btn.textContent = n > 0 ? `${text} ${n}s` : text; n -= 1; };
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }
  function waitThen(btn, label, secs) {
    btn.disabled = true;
    const stop = countdown(btn, 'Try again in', secs);
    const t = setTimeout(() => { stop(); btn.disabled = false; btn.textContent = btn === authGo ? (authMode === 'up' ? 'Create account' : 'Sign in') : label; }, secs * 1000);
    if (btn === authGo) waitTimers.push({stop}, t);
  }
  function modeUI(m) {
    authMode = m; authState = null;
    $('#tab-in').classList.toggle('on', m === 'in'); $('#tab-up').classList.toggle('on', m === 'up');
    $('#tab-in').setAttribute('aria-selected', m === 'in'); $('#tab-up').setAttribute('aria-selected', m === 'up');
    $('#f-name').hidden = m === 'in'; $('#auth-name').required = m === 'up';
    authPass.autocomplete = m === 'up' ? 'new-password' : 'current-password';
    authPass.placeholder = m === 'up' ? 'At least 8 characters' : 'Password';
    authGo.textContent = m === 'up' ? 'Create account' : 'Sign in'; authGo.disabled = false;
  }
  function setMode(m) { cancelWait(); modeUI(m); hint(''); if (m === 'up') checkUsername(); showAuth(); }
  $('#tab-in').onclick = () => setMode('in');
  $('#tab-up').onclick = () => setMode('up');
  function checkUsername() {
    clearTimeout(check); authState = null;
    if (authMode !== 'up') return;
    const u = authUser.value.trim().replace(/^@/, '').toLowerCase();
    if (!u) { hint('Pick a username. Teammates add you with it.'); return; }
    if (!USERNAME_RE.test(u)) { hint('Use 2 to 30 letters, numbers, dots, dashes or underscores, starting with a letter or number.', 'err'); return; }
    hint('Checking…');
    check = setTimeout(async () => {
      let r;
      try { r = await api('/api/username/' + encodeURIComponent(u)); }
      catch (e) { if (authMode === 'up' && authUser.value.trim().replace(/^@/, '').toLowerCase() === u) hint(e.said ? e.message : "Couldn't check that username right now.", 'err'); return; }
      if (authMode !== 'up' || authUser.value.trim().replace(/^@/, '').toLowerCase() !== u) return;
      authState = r;
      if (!r.valid) hint(r.message, 'err');
      else if (r.available) hint(`@${u} is available.`, 'ok');
      else hint(`@${u} is taken. Pick another, or sign in if it's yours.`, 'err');
    }, 250);
  }
  authUser.oninput = checkUsername;
  authPass.oninput = () => { if (/password/i.test(authHint.textContent) && authHint.classList.contains('err')) authMode === 'up' ? checkUsername() : hint(''); };
  $('#auth-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const body = {username: authUser.value.trim(), password: authPass.value};
    if (authMode === 'up') {
      if (authState && (!authState.valid || !authState.available)) return;
      if (authPass.value.length < 8) { hint('Use at least 8 characters for your password.', 'err'); return; }
      body.name = $('#auth-name').value.trim();
    }
    const label = authGo.textContent;
    authGo.disabled = true; authGo.classList.add('busy');
    const stop = authMode === 'up' ? (authGo.textContent = 'Creating account…', () => {}) : countdown(authGo, 'Checking password…', 10);
    const done = () => { stop(); authGo.disabled = false; authGo.classList.remove('busy'); authGo.textContent = label; };
    try {
      const r = await api(authMode === 'up' ? '/api/signup' : '/api/signin', body);
      authPass.value = ''; done(); ME = r.user; start();
    } catch (e) {
      done();
      if (e.status === 429 && e.retryAfter) { hint(e.message, 'err'); waitThen(authGo, label, e.retryAfter); }
      else hint(e.message, 'err');
    }
  };

  // ---------------------------------------------------------------- start
  function start() {
    if (owner && owner !== ME.username) { queued = []; current = null; input.value = ''; grow(); }  // never send one person's notes as another
    owner = ME.username;
    $('#auth').hidden = true; $('#app').hidden = false; $('#open-settings').hidden = false;
    chat.innerHTML = '';
    if (!ME.profile) { run(startInterview); return; }
    sys(`${ME.first}'s agent · @${ME.username}`);
    profileCard();
    say(`Welcome back, ${esc(ME.first)}. Just met someone? Tap the mic and tell me about it.`);
    mainChips();
  }
  (async () => {
    try {
      const r = await api('/api/me');
      if (r.user) { ME = r.user; start(); } else showAuth();
    } catch (e) { if (!(e instanceof NeedsSignin)) showAuth(); }
  })();
})();
</script></body></html>

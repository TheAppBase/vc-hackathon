<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Touch</title><style>

radial-gradient(50% 30% at 15% 75%,rgba(214,120,72,.26),transparent 70%),radial-gradient(70% 45% at 50% 0%,rgba(255,255,255,.35),transparent 70%)}

.app{height:100%;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:72px max(20px,calc(50% - 440px)) 12px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;padding:3px 0;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

.card{background:var(--glass-strong);border:1px solid var(--edge);border-radius:18px;padding:14px 16px;box-shadow:0 4px 18px rgba(16,44,52,.1);animation:in .3s ease-out}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-width:860px}
.lead .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.lead h4{margin:0;font-size:16px}.lead small{color:var(--muted);display:block}
.ring{--p:0;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
background:radial-gradient(closest-side,var(--solid) 78%,transparent 80%),conic-gradient(var(--blue) calc(var(--p)*1%),rgba(127,127,127,.2) 0)}

.pill.s-hot,.pill.s-due,.pill.v-take{color:#c93400;background:rgba(255,149,0,.15);border-color:transparent}
.pill.s-overdue{color:var(--red);background:rgba(255,59,48,.13);border-color:transparent}.pill.s-scheduled,.pill.v-warm{color:var(--blue);background:rgba(10,132,255,.12);border-color:transparent}
.pill.s-park,.pill.s-parked,.pill.s-warm,.pill.s-pass{color:var(--gray);background:rgba(142,142,147,.15);border-color:transparent}

.why{font-size:12.5px;color:var(--muted)}.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;background:var(--glass);border:1px solid var(--edge);
box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}.btn.primary{background:var(--grad);color:#fff;border-color:transparent}.btn:hover{filter:brightness(1.05)}
.profile{max-width:560px}.profile .head{display:flex;gap:12px;align-items:center;margin-bottom:8px}.profile .head b{font-size:17px;display:block}

.bars{display:grid;gap:5px;margin-top:10px}.bar{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}

.rows{max-width:760px;padding:6px 16px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.src{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);color:var(--blue);flex:none}
.row b{font-weight:600}.row small{display:block;color:var(--muted);font-size:12.5px}.row .right{text-align:right;font-size:12px;color:var(--muted)}
.draft{white-space:pre-wrap;font-size:14px;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin:6px 0}
.bottom{padding:0 max(14px,calc(50% - 450px)) 16px}

-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:inline-flex;align-items:center;gap:6px}

.corner{position:fixed;top:16px;right:18px;z-index:30;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.sheet{width:min(400px,100vw);height:100vh;height:100dvh;max-height:none;margin:0 0 0 auto;padding:22px 22px 30px;border-radius:22px 0 0 22px;border-right:0;
overflow-y:auto;color:var(--text)}
.sheet[open]{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(10,20,22,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:20px}

.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}.list li small{display:block;color:var(--muted);font-size:12px}.list li .end{margin-left:auto}
.toggle{width:40px;height:24px;border-radius:999px;border:0;background:rgba(127,127,127,.3);position:relative;transition:background .2s;flex:none}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--green)}.toggle.on:after{transform:translateX(16px)}
.add{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.add input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--text);padding:6px 10px;outline:none}
.hint{color:var(--muted);font-size:12px;margin:8px 2px 0}.hint.err{color:var(--red)}.rm{background:none;border:0;color:var(--muted);font-size:12.5px}
.small{color:var(--muted);font-size:12.5px}
@media (max-width:620px){.chat{padding:64px 12px 10px}.indent{margin-left:0}.bubble{max-width:88%}.corner{top:10px;right:10px}
.kv{grid-template-columns:90px 1fr}.bar{grid-template-columns:100px 1fr 30px}.chips{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{flex:none}.bottom{padding:0 10px 10px}.row{grid-template-columns:auto 1fr}.row .right{grid-column:2;text-align:left}}

[hidden]{display:none!important}
.composer{border-radius:26px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--text);padding:8px 12px;outline:none;resize:none;
max-height:168px;line-height:1.45}
.composer.listening{box-shadow:var(--shadow),0 0 0 2px rgba(255,59,48,.55)}
.round.mic.on{background:var(--red);color:#fff;border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}50%{box-shadow:0 0 0 8px rgba(255,59,48,0)}}
.listen-hint{font-size:12px;color:var(--red);text-align:center;margin:-2px 0 6px;min-height:0}
.auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px}
.auth .card{width:min(400px,100%);padding:26px}.auth h1{margin:0 0 4px;font-size:24px}.auth p{margin:0 0 16px;color:var(--muted);font-size:14px}
.field{display:block;margin:0 0 12px}.field span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
.field input{width:100%;border:1px solid var(--edge);background:var(--glass);border-radius:12px;padding:10px 12px;font:inherit;color:var(--text);outline:none}
.field input:focus{border-color:var(--blue)}
.hint.ok{color:var(--green)}.wide{width:100%;justify-content:center;padding:10px 14px;font-size:14px}
.action{max-width:600px;border-radius:16px;padding:12px 14px;background:var(--glass-strong);border:1px solid var(--edge);animation:in .25s ease-out}
.action .th{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}.action .th .ic{color:var(--orange)}
.action .th b{color:var(--text);font-size:13px}.action .st{margin-left:auto;font-weight:600}
.action.needs_approval{border-color:rgba(255,149,0,.55)}.action.done .th .ic,.action.done .st{color:var(--green)}
.action.blocked,.action.failed{border-color:rgba(255,59,48,.5)}.action.blocked .st,.action.failed .st,.action.blocked .th .ic{color:var(--red)}
.action.denied .st{color:var(--gray)}.action .body{font-size:13.5px;margin:8px 0 2px;white-space:pre-wrap;max-height:220px;overflow:auto}
.action .why{margin-top:4px}
.xt{display:grid;grid-template-columns:88px 1fr;gap:2px 10px;font-size:13px;margin:8px 0 0}.xt dt{color:var(--muted)}.xt dd{margin:0}
.seg{display:grid;gap:8px}.seg label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);
background:var(--glass);cursor:pointer}.seg label.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.seg label.off{opacity:.55;cursor:not-allowed}.seg input{margin-top:4px}.seg small{display:block;color:var(--muted);font-size:12px}
.log li{font-size:12.5px}.log .pill{margin-left:auto;flex:none}
</style></head><body>
<div class="app" id="app" hidden><div class="chat" id="chat" aria-live="polite"></div>
<div class="bottom"><div class="chips" id="chips"></div><div class="listen-hint" id="listen-hint"></div>
<form class="composer glass" id="composer"><button type="button" class="round mic" id="mic" aria-label="Record a note" title="Record a note"></button>
<textarea id="input" rows="1" autocomplete="off" placeholder="Record or type a note, or ask your agent" aria-label="Message"></textarea><button class="round send" aria-label="Send" id="send"></button></form></div></div>
<button class="corner glass" id="open-settings" aria-label="Settings" hidden></button>
<dialog class="glass sheet" id="settings"></dialog>
<div class="auth" id="auth" hidden><form class="card glass" id="auth-form" autocomplete="off">
<h1>Last Touch</h1><p>Your personal sourcing agent. Record a quick note after every event; it keeps track of who you met and what's next, and shares it with your team.</p>
<label class="field"><span>Your name</span><input id="auth-name" placeholder="Your name" maxlength="60" required></label>
<label class="field"><span>Username</span><input id="auth-user" placeholder="your-username" maxlength="31" required autocapitalize="off" spellcheck="false"></label>
<p class="hint" id="auth-hint">Pick a username. Teammates add you with it.</p>
<button class="btn primary wide" id="auth-go" disabled>Continue</button></form></div>
<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const ic = (n, s) => `<svg class="ic" width="${s || 16}" height="${s || 16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${D.icons[n] || ''}</svg>`;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const chat = $('#chat'), chipsEl = $('#chips'), input = $('#input');
  let ME = null;
  $('#mic').innerHTML = ic('mic', 18); $('#send').innerHTML = ic('up', 18); $('#open-settings').innerHTML = ic('settings', 18);

  // ---------------------------------------------------------------- server
  class NeedsSignin extends Error {}
  async function api(url, body, method) {
    const opts = {method: method || (body === undefined ? 'GET' : 'POST'), headers: {}};
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    let j = {}; try { j = await r.json(); } catch (e) { j = {}; }
    if (r.status === 401) { showAuth(); throw new NeedsSignin(); }
    if (!r.ok) { const e = new Error(j.message || j.error || ('HTTP ' + r.status)); e.code = j.error; e.status = r.status; throw e; }
    return j;
  }

  // ---------------------------------------------------------------- chat primitives
  const initials = (n) => String(n).replace(/^@/, '').split(/[\s._-]+/).map((p) => p[0] || '').join('').slice(0, 2).toUpperCase();
  const hue = (s) => `hsl(${[...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7)} 60% 50%)`;
  const me = () => (ME ? `${ME.first}'s agent` : 'Your agent');
  const scroll = () => { chat.scrollTop = chat.scrollHeight; };
  function add(html) { chat.insertAdjacentHTML('beforeend', html); scroll(); return chat.lastElementChild; }
  function agentAvatar(who) {
    if (!who) return `<span class="avatar me-agent">${ic('spark', 16)}</span>`;
    return `<span class="avatar" style="--hue:${hue(who.id)}">${esc(initials(who.name))}</span>`;
  }
  function say(html, who) {
    const name = who ? `${who.name}'s agent` : me();
    return add(`<div class="msg">${agentAvatar(who)}<div class="bubble"><b class="who">${esc(name)}</b><div>${html}</div></div></div>`);
  }
  const mine = (text) => add(`<div class="msg me"><div class="bubble" style="white-space:pre-wrap">${esc(text)}</div></div>`);
  const sys = (text) => add(`<div class="msg sys"><span>${esc(text)}</span></div>`);
  const block = (html) => add(`<div class="indent">${html}</div>`);
  async function typing(ms) {
    const el = add(`<div class="msg typing">${agentAvatar()}<div class="bubble"><i></i><i></i><i></i></div></div>`);
    await sleep(ms || 400); el.remove();
  }
  async function tool(call, fn, opts) {
    opts = opts || {};
    const icon = opts.kind === 'mem' ? 'db' : opts.kind === 'agent' ? 'agent' : opts.kind || 'tool';
    const head = esc(me()) + (opts.target ? ` &rarr; ${esc(opts.target)}` : '');
    const el = block(`<div class="toolcard running"><div class="th">${ic(icon, 14)}<span class="tk">${opts.write ? 'Write' : 'Read'}</span><span>${head}</span><span class="st">running</span></div><code>${esc(call)}</code><div class="tr"></div></div>`);
    const card = el.querySelector('.toolcard'), st = card.querySelector('.st');
    try {
      const res = await fn();
      card.classList.remove('running'); st.textContent = 'done'; st.classList.add('ok');
      card.querySelector('.tr').textContent = opts.result ? opts.result(res) : ''; scroll();
      return res;
    } catch (e) {
      card.classList.remove('running'); st.textContent = 'failed'; st.style.color = 'var(--red)';
      card.querySelector('.tr').textContent = e instanceof NeedsSignin ? 'signed out' : e.message; scroll();
      throw e;
    }
  }
  function setChips(list) {
    chipsEl.innerHTML = list.map((c, i) => `<button type="button" class="chip ${c.cls || ''}" data-i="${i}">${c.icon ? ic(c.icon, 14) : ''}${esc(c.label)}</button>`).join('');
    chipsEl.onclick = (ev) => { const b = ev.target.closest('.chip'); if (b && (!busy || b.dataset.free)) list[+b.dataset.i].act(b); };
  }
  let busy = false;
  async function run(fn) {
    if (busy) return; busy = true;
    try { await fn(); } catch (e) {
      if (e instanceof NeedsSignin) return;
      say(esc(e.message || 'Something went wrong. Try again.'));
    } finally { busy = false; }
  }

  // ---------------------------------------------------------------- dictation (no time limit, fills the chat box live)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, baseText = '', finalText = '', dictated = false;
  const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 168) + 'px'; };
  function micUI() {
    $('#mic').classList.toggle('on', listening); $('#composer').classList.toggle('listening', listening);
    $('#mic').innerHTML = ic(listening ? 'stop' : 'mic', 18);
    $('#mic').setAttribute('aria-label', listening ? 'Stop recording' : 'Record a note');
    $('#listen-hint').textContent = listening ? 'Recording. Talk as long as you like, then tap stop or send.' : '';
  }
  function startDictation() {
    if (!SR) { sys('Recording needs Chrome, Edge or Safari. You can type the note instead.'); input.focus(); return; }
    listening = true; dictated = true; finalText = '';
    baseText = input.value.trim() ? input.value.replace(/\s*$/, ' ') : '';
    rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { const sofar = baseText + finalText; finalText += r[0].transcript.trim().replace(/^/, sofar && !/\s$/.test(sofar) ? ' ' : ''); }
        else interim += r[0].transcript;
      }
      input.value = (baseText + finalText + (interim ? ' ' + interim.trim() : '')).replace(/^\s+/, '');
      grow(); input.scrollTop = input.scrollHeight;
    };
    rec.onerror = (e) => {
      if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) {
        stopDictation(); sys(e.error === 'audio-capture' ? 'No microphone found.' : 'Microphone access is blocked. Allow it in your browser to record.');
      }
    };
    // Browsers end recognition after a pause; keep restarting until the user stops, so there is no time limit.
    rec.onend = () => {
      if (!listening) return;
      baseText = (baseText + finalText).replace(/\s*$/, ' '); finalText = '';
      try { rec.start(); } catch (e) { setTimeout(() => { if (listening) try { rec.start(); } catch (x) { stopDictation(); } }, 250); }
    };
    try { rec.start(); } catch (e) { listening = false; }
    micUI(); input.focus();
  }
  function stopDictation() {
    listening = false;
    if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
    micUI();
  }
  $('#mic').onclick = () => (listening ? stopDictation() : startDictation());
  input.addEventListener('input', () => { grow(); if (listening) { baseText = input.value.replace(/\s*$/, ' '); finalText = ''; } });
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $('#composer').requestSubmit(); } });

  // ---------------------------------------------------------------- saving a note (the only write): Ask mode asks, Auto mode asks PRISM
  const ST = {needs_approval: 'Needs your OK', done: 'Saved', blocked: 'Blocked', denied: 'Not saved', failed: 'Failed'};
  function actionHTML(a) {
    const x = (a.payload || {}).extracted || {};
    const rows = [['Founder', x.founder], ['Company', x.company], ['Met at', x.event], ['Next step', x.next_step && (x.next_step + (x.next_due ? ` (by ${x.next_due})` : ''))],
      ['Stage', [x.sector, x.stage].filter(Boolean).join(' · ')]].filter(([, v]) => v);
    const xt = rows.length ? `<dl class="xt">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '<div class="why">I could not find a founder or company in this note. It is still saved as a note.</div>';
    const rv = a.review ? `<div class="why">PRISM review: ${esc(a.review.decision)}${a.review.reason ? ` (${esc(a.review.reason)})` : ''}</div>` : '';
    const reason = a.reason ? `<div class="why">${esc(a.reason)}</div>` : '';
    const done = a.result && a.result.text ? `<div class="why">${esc(a.result.text)}</div>` : '';
    const btns = a.status === 'needs_approval' ? `<div class="acts"><button class="btn primary" data-approve="${esc(a.id)}">${ic('check', 13)}Save</button><button class="btn" data-deny="${esc(a.id)}">Don't save</button></div>` : '';
    return `<div class="action ${esc(a.status)}" data-aid="${esc(a.id)}"><div class="th">${ic('shield', 14)}<b>${esc(a.summary)}</b>
      <span class="st">${esc(ST[a.status] || a.status)}</span></div><div class="small">${a.mode === 'auto' ? 'Auto mode · checked by PRISM' : 'Ask mode · waiting for you'}</div>
      <div class="body">${esc((a.payload || {}).text || '')}</div>${a.status === 'blocked' && !rows.length ? '' : xt}${rv}${reason}${done}${btns}</div>`;
  }
  chat.addEventListener('click', async (ev) => {
    const ok = ev.target.closest('[data-approve]'), no = ev.target.closest('[data-deny]');
    if (!ok && !no) return;
    const id = (ok || no).dataset.approve || (ok || no).dataset.deny;
    const card = chat.querySelector(`[data-aid="${CSS.escape(id)}"]`);
    card.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    try { const a = await api(`/api/actions/${id}`, {approve: !!ok}); card.outerHTML = actionHTML(a); }
    catch (e) { card.querySelectorAll('button').forEach((b) => { b.disabled = false; }); if (!(e instanceof NeedsSignin)) say(esc(e.message)); }
  });
  async function note(text, source) {
    const a = await tool('read_note() → save_note()', () => api('/api/actions', {type: 'save_note', payload: {text, source}}), {kind: 'db', write: true,
      result: (a) => `read with ${a.reader} · ${a.hits.length ? `${a.hits.length} teammate match${a.hits.length > 1 ? 'es' : ''}` : 'no teammate has met them yet'} · ${(ST[a.status] || a.status).toLowerCase()}`});
    block(actionHTML(a));
    for (const h of a.hits) say(esc(h.text), {id: h.username, name: h.who});
  }

  // ---------------------------------------------------------------- interview
  const Q = D.interview;
  let step = -1, answers = {};
  async function startInterview() {
    answers = {}; step = -1;
    sys('Build your personal agent');
    await next();
  }
  async function next() {
    step += 1;
    const q = Q[step];
    await typing(350);
    say(esc(q.q.replace('{name}', ME.first)));
    input.placeholder = 'Type or record an answer, or pick one';
    setChips(q.chips.map((c) => ({label: c, act: () => run(() => answer(c))})));
  }
  async function answer(text) {
    mine(text); setChips([]);
    answers[Q[step].key] = text;
    if (step < Q.length - 1) return next();
    input.placeholder = 'Record or type a note, or ask your agent';
    const r = await tool(`learn_thesis("${answers.focus || ''}")`, () => api('/api/profile', answers), {kind: 'db', result: (r) => r.user.profile.weights_text});
    ME = r.user; step = -1;
    profileCard();
    await typing(300);
    say(`I'm ready, ${esc(ME.first)}. After every event or meeting, tap the mic and tell me who you met, what they're building and what's next. I'll keep track, rank founders with your criteria, and check with your teammates' agents so nobody drops a founder.`);
    mainChips();
  }
  function profileCard() {
    const p = ME.profile;
    const bars = Object.entries(p.weights).filter(([, v]) => v).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `<div class="bar"><span>${esc({mutual: 'warm intro', capital_efficiency: 'capital efficiency', technical_depth: 'technical depth', founder_fit: 'founder fit'}[k] || k)}</span><span class="t"><i style="width:${v * 2.5}%"></i></span><span>${v}%</span></div>`).join('');
    block(`<div class="card profile"><div class="head">${agentAvatar()}<div><b>${esc(ME.first)}'s agent</b><span class="small">@${esc(ME.username)} · built from your interview</span></div></div>
      <dl class="kv"><dt>Role</dt><dd>${esc(p.role)}</dd><dt>Focus</dt><dd>${esc(p.sectors.join(', '))} · ${esc(p.stages.join(', '))}</dd>
      <dt>Trusts</dt><dd>${esc(p.signal || 'A balanced read')}</dd>
      <dt>Saving notes</dt><dd>${ME.mode === 'auto' ? 'Auto: PRISM approves or blocks' : 'Asks you first'}</dd></dl><div class="bars">${bars}</div></div>`);
  }
  function mainChips() {
    setChips([
      {label: 'Record a note', icon: 'mic', act: () => (listening ? stopDictation() : startDictation())},
      {label: 'Who have I been talking to?', icon: 'list', act: () => run(() => ask('Who have I been talking to?'))},
      {label: 'Rank my founders', icon: 'spark', act: () => run(() => ask('Rank my founders'))},
      {label: 'What is my team working on?', icon: 'agent', act: () => run(() => ask('What is my team working on?'))},
    ]);
    chipsEl.querySelector('.chip').dataset.free = '1';
  }

  // ---------------------------------------------------------------- skills (reads)
  let FOUNDERS = [];
  async function ask(text, source) {
    mine(text);
    const q = text.toLowerCase().trim();
    let m;
    if ((m = text.trim().match(/^(?:ask (?:the |my )?team (?:about )?|who (?:else )?knows |has anyone (?:else )?met )(.+?)\??$/i))) return askTeam(m[1]);
    if (/^(rank|score|source)\b|my founders|best founders|who should i (meet|back|call)/.test(q)) return rank();
    if (/who (have|am) i (been )?talk|who did i meet|my conversations|what('s| is) next|follow[- ]?ups?\??$|what do i owe|overdue/.test(q)) return contacts();
    if (/what is my team|team working|what's my team|my team doing/.test(q)) return team();
    if (/^(help|what can you do)\??$/.test(q)) {
      return say('Record a note after any event or meeting and I\'ll read out the founder, company, where you met and your next step. Then ask "who have I been talking to?", "rank my founders", "what is my team working on?" or "who knows Patchbay?". Anything that isn\'t a question, I save as a note.');
    }
    return note(text, source);
  }
  async function loadFounders() {
    const r = await tool('list_founders(my notes)', () => api('/api/founders'), {kind: 'db',
      result: (r) => `${r.notes} notes · ${r.founders.length} founders · ${r.founders.filter((f) => f.status === 'due' || f.status === 'overdue').length} need a follow-up`});
    FOUNDERS = r.founders;
    return r;
  }
  const label = (f) => esc(f.founder || f.company) + (f.founder && f.company ? ` · ${esc(f.company)}` : '');
  async function contacts() {
    const r = await loadFounders();
    if (!r.founders.length) {
      say(r.notes ? 'Your notes don\'t name any founders or companies yet. Try something like "Met Jonah Weiss from Patchbay at the hackathon. Next step: intro to Cara by Monday."'
        : 'No notes yet. After your next event or meeting, tap the mic and tell me who you met and what\'s next.');
      return;
    }
    const order = {overdue: 0, due: 1, scheduled: 2, warm: 3};
    const rows = r.founders.slice().sort((a, b) => (order[a.status] - order[b.status]) || (a.last_touch < b.last_touch ? 1 : -1));
    say(`You've noted ${r.founders.length} founder${r.founders.length === 1 ? '' : 's'}. Here is who, where you met, and what's next:`);
    block(`<div class="card rows">${rows.map((f) => `<div class="row"><span class="src">${ic('note', 16)}</span>
      <div><b>${label(f)}</b><small>${f.event ? `Met at ${esc(f.event)} · ` : ''}first noted ${esc(f.first_met)}${f.notes > 1 ? ` · ${f.notes} notes` : ''}</small><small>Next: ${esc(f.next_step || 'nothing noted')}</small></div>
      <div class="right"><span class="pill s-${esc(f.status)}">${esc(f.due)}</span><br>${esc(f.when)}</div></div>`).join('')}</div>`);
    const urgent = rows.filter((f) => f.status === 'overdue' || f.status === 'due');
    if (urgent.length) say(`${urgent.length} need you now: ${urgent.slice(0, 5).map((f) => `${esc(f.founder || f.company)} (${esc(f.next_step)}${f.status === 'overdue' ? ', overdue' : ''})`).join(', ')}.`);
    for (const f of rows.filter((f) => f.known.length).slice(0, 3)) for (const h of f.known) say(esc(h.text), {id: h.username, name: h.who});
  }
  async function rank() {
    const r = await loadFounders();
    if (!r.founders.length) { say('No founders in your notes yet. Record a note after your next event and I\'ll rank them with your criteria.'); return; }
    const ranked = r.founders.slice().sort((a, b) => (a.verdict === 'Outside your thesis') - (b.verdict === 'Outside your thesis') || b.score - a.score);
    const show = ranked.slice(0, 6);
    say(`Ranked by your own criteria (${esc(ME.profile.weights_text)}).${ranked.length > show.length ? ` ${ranked.length - show.length} more below.` : ''} Scores only use what your notes say, so the more you note (traction, raise, background), the better I rank.`);
    block(`<div class="cards">${show.map(leadCard).join('')}</div>`);
  }
  function leadCard(f) {
    const v = f.verdict === 'Take the next call' ? 'v-take' : f.verdict === 'Keep warm' ? 'v-warm' : '';
    return `<div class="card lead"><div class="top"><div><h4>${esc(f.company || f.founder)}</h4><small>${esc(f.founder && f.company ? f.founder : '')}${f.event ? `${f.founder && f.company ? ' · ' : ''}met at ${esc(f.event)}` : ''}</small></div>
      <div class="ring" style="--p:${f.score}" title="Score on your criteria">${f.score}</div></div><p>${esc(f.one_liner || f.latest)}</p>
      <div class="meta"><span class="pill ${v}">${esc(f.verdict)}</span><span class="pill">${esc(f.sector || 'sector not noted')} · ${esc(f.stage || 'stage not noted')}</span>${f.known.length ? `<span class="pill s-scheduled">Known to ${esc(f.known[0].who)}</span>` : ''}</div>
      <div class="why">Why: ${esc(f.why)}${f.traction !== 'Not stated' ? ` · ${esc(f.traction)}` : ''}${f.raise ? ` · raising ${esc(f.raise)}` : ''}${f.filled_from && f.filled_from.length ? ` · filled in from ${esc(f.filled_from.join(' and '))}'s notes` : ''}</div>
      <div class="acts"><button class="btn primary" data-draft="${esc(f.id)}">${ic('copy', 13)}Draft follow-up</button><button class="btn" data-team="${esc(f.id)}">${ic('agent', 13)}Ask the team</button></div></div>`;
  }
  chat.addEventListener('click', (ev) => {
    const d = ev.target.closest('[data-draft]'), t = ev.target.closest('[data-team]'), c = ev.target.closest('[data-copy]');
    if (c) { navigator.clipboard && navigator.clipboard.writeText(c.closest('.indent, .bubble').querySelector('.draft').textContent).then(() => { c.textContent = 'Copied'; }); return; }
    if (busy) return;
    if (d) { const f = FOUNDERS.find((x) => x.id === d.dataset.draft); if (f) draft(f); }
    if (t) { const f = FOUNDERS.find((x) => x.id === t.dataset.team); if (f) run(() => ask(`Ask the team about ${f.company || f.founder}`)); }
  });
  function draft(f) {
    const who = (f.founder || '').split(' ')[0] || 'there';
    const where = f.event ? ` at ${f.event}` : '';
    const text = `Hi ${who},\n\nGreat to meet you${where}. I'd love to keep the conversation going about ${f.company || 'what you\'re building'}. Do you have 20 minutes next week?\n\nBest,\n${ME.first}`;
    say(`Here is a follow-up for ${esc(f.founder || f.company)}. Copy it into your email or messages; I don't send anything.<div class="draft">${esc(text)}</div><div class="acts"><button class="btn" data-copy>${ic('copy', 13)}Copy</button></div>`);
  }
  async function askTeam(q) {
    if (!ME.team.length) { say('You have no teammates yet. Add people by username in Settings.'); return; }
    const r = await tool(`who_knows("${q}")`, () => api('/api/team/search?q=' + encodeURIComponent(q)), {kind: 'agent', target: 'team agents',
      result: (r) => `${r.hits.length} repl${r.hits.length === 1 ? 'y' : 'ies'}`});
    if (!r.hits.length) { say(`Nobody on your team has noted ${esc(q)}. It's yours.`); return; }
    for (const h of r.hits) say(esc(h.text), {id: h.username, name: h.who});
  }
  async function team() {
    if (!ME.team.length) { say('You have no teammates yet. Open Settings and add people by their username.'); return; }
    const r = await tool('list_relationships()', () => api('/api/team/activity'), {kind: 'agent', target: 'team agents',
      result: (r) => `${r.team.length} agent${r.team.length === 1 ? '' : 's'} replied`});
    for (const m of r.team) {
      if (!m.count) { say(`No founders in my notes yet.${m.latest ? ` Latest note: "${esc(m.latest)}"` : ''}`, {id: m.username, name: m.name.split(' ')[0]}); continue; }
      const lines = m.founders.map((f) => `${esc(f.who)}${f.event ? ` (met at ${esc(f.event)})` : ''}, ${esc(f.when)}: ${esc(f.next_step || 'no next step')}${f.status === 'overdue' ? ' · overdue' : ''}`);
      say(`Talking to ${m.count} founder${m.count === 1 ? '' : 's'}${m.focus ? `. Focus: ${esc(m.focus)}` : ''}.<br>${lines.join('<br>')}`, {id: m.username, name: m.name.split(' ')[0]});
    }
    if (r.pending.length) sys(`Waiting for ${r.pending.map((u) => '@' + u).join(', ')} to add you back before their agents share with you.`);
  }

  // ---------------------------------------------------------------- settings

    const dlg = $('#settings'), p = ME.profile;
    let teamRows = '<li class="small">Loading…</li>', log = '', prism = '';
    const draw = () => {
      dlg.innerHTML = `<div class="sheet-head"><h2>Settings</h2><button class="round mic" id="close-settings" aria-label="Close">${ic('x', 16)}</button></div>
      <h3>Account</h3><ul class="list"><li>${agentAvatar({id: ME.username, name: ME.name})}<span><b>${esc(ME.name)}</b><small>@${esc(ME.username)}</small></span><button class="rm end" id="signout">Sign out</button></li></ul>
      <h3>Your agent</h3>${p ? `<ul class="list"><li>${agentAvatar()}<span><b>${esc(ME.first)}'s agent</b><small>${esc(p.sectors.join(', '))} · ${esc(p.stages.join(', '))}</small></span></li></ul>
        <button class="btn" id="redo">Redo the interview</button>` : '<p class="small">Finish the interview in the chat to build your agent.</p>'}
      <h3>When the agent saves a note</h3><div class="seg">

      </div><p class="hint">Reading is always allowed. In both modes I never save secrets (keys, passwords, card numbers).</p>${prism}
      <h3>Team</h3><ul class="list" id="team-list">${teamRows}</ul>
      <h3>Add a person</h3><form class="add" id="add-person"><input id="username" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Their username" aria-label="Username"><button class="btn primary" id="add-btn">${ic('userplus', 14)}Add</button></form>

    const removeMate = async (u) => { ME = (await api('/api/team/' + encodeURIComponent(u), undefined, 'DELETE')).user; sys(`@${u} was removed from your team`); loadTeam(); };
    const wire = () => {
      $('#close-settings').onclick = () => dlg.close();
      $('#signout').onclick = async () => { await api('/api/signout', {}); location.href = '/'; };
      const redo = $('#redo'); if (redo) redo.onclick = () => { dlg.close(); run(startInterview); };
      dlg.querySelectorAll('input[name=mode]').forEach((r) => { r.onchange = async () => {
        try { ME = (await api('/api/settings', {mode: r.value})).user; sys(ME.mode === 'auto' ? 'Auto mode: PRISM watches the agent and reviews every note.' : 'Ask mode: I ask before saving every note.'); }
        catch (e) { if (!(e instanceof NeedsSignin)) sys(e.message); }
        draw();
      }; });
      dlg.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => removeMate(b.dataset.rm); });
      const uIn = $('#username'), hint = $('#add-hint');
      let t = null;
      uIn.oninput = () => {
        clearTimeout(t);
        const u = uIn.value.trim().replace(/^@/, '').toLowerCase();
        if (!u) { hint.textContent = 'Type their username.'; hint.className = 'hint'; return; }
        t = setTimeout(async () => {
          const r = await api('/api/username/' + encodeURIComponent(u));
          if (uIn.value.trim().replace(/^@/, '').toLowerCase() !== u) return;
          if (!r.valid) { hint.textContent = r.message; hint.className = 'hint err'; }
          else if (r.exists) { hint.textContent = u === ME.username ? "That's you." : `@${u} exists.`; hint.className = u === ME.username ? 'hint err' : 'hint ok'; }
          else { hint.textContent = `No one is called @${u}.`; hint.className = 'hint err'; }

      };
    };

      const r = await api('/api/team');

      if (pr) prism = `<p class="hint ${pr.credential === 'ok' ? 'ok' : 'err'}">PRISM: ${pr.credential === 'ok' ? 'credential OK' : `credential ${esc(pr.credential)}${pr.detail ? ` (${esc(pr.detail)})` : ''}`}${pr.credential === 'ok' ? (pr.live ? ', live traces arriving' : `, waiting for live traces${pr.blocked_step ? ` (${esc(pr.blocked_step)})` : ''}`) : ''}.</p>`;

  }
  $('#open-settings').onclick = () => { $('#settings').showModal(); renderSettings(); };

  // ---------------------------------------------------------------- composer
  $('#composer').addEventListener('submit', (ev) => {
    ev.preventDefault();

    stopDictation(); dictated = false;
    const text = input.value.trim(); if (!text) return;

  });

  // ---------------------------------------------------------------- sign in
  function showAuth() {
    $('#app').hidden = true; $('#open-settings').hidden = true; $('#auth').hidden = false;
    $('#auth-name').focus();
  }
  let check = null, authState = null;
  const authUser = $('#auth-user'), authHint = $('#auth-hint'), authGo = $('#auth-go');
  authUser.oninput = () => {
    clearTimeout(check); authState = null; authGo.disabled = true;
    const u = authUser.value.trim().replace(/^@/, '').toLowerCase();
    if (!u) { authHint.textContent = 'Pick a username. Teammates add you with it.'; authHint.className = 'hint'; authGo.textContent = 'Continue'; return; }
    authHint.textContent = 'Checking…'; authHint.className = 'hint';
    check = setTimeout(async () => {
      const r = await api('/api/username/' + encodeURIComponent(u));
      if (authUser.value.trim().replace(/^@/, '').toLowerCase() !== u) return;
      authState = r;
      if (!r.valid) { authHint.textContent = r.message; authHint.className = 'hint err'; authGo.textContent = 'Continue'; return; }
      authGo.disabled = false;
      if (r.available) { authHint.textContent = `@${u} is available.`; authHint.className = 'hint ok'; authGo.textContent = 'Create account'; }
      else { authHint.textContent = `@${u} exists. Enter the name on that account to sign in.`; authHint.className = 'hint'; authGo.textContent = 'Sign in'; }
    }, 250);
  };
  $('#auth-form').onsubmit = async (ev) => {
    ev.preventDefault();
    if (!authState || !authState.valid) return;
    const body = {name: $('#auth-name').value.trim(), username: authUser.value.trim()};
    authGo.disabled = true;
    try {
      const r = await api(authState.available ? '/api/signup' : '/api/signin', body);
      ME = r.user; start();
    } catch (e) { authHint.textContent = e.message; authHint.className = 'hint err'; authGo.disabled = false; }
  };

  // ---------------------------------------------------------------- start
  function start() {
    $('#auth').hidden = true; $('#app').hidden = false; $('#open-settings').hidden = false;
    chat.innerHTML = '';
    if (!ME.profile) { run(startInterview); return; }
    sys(`${ME.first}'s agent · @${ME.username}`);
    profileCard();
    say(`Welcome back, ${esc(ME.first)}. Just met someone? Tap the mic and tell me about it.`);
    mainChips();
  }
  (async () => {
    try {
      const r = await api('/api/me');
      if (r.user) { ME = r.user; start(); } else showAuth();
    } catch (e) { if (!(e instanceof NeedsSignin)) showAuth(); }
  })();
})();
</script></body></html>
